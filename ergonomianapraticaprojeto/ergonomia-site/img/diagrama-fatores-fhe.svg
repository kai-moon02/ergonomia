<text x="765" y="380">Participação</text><text x="765" y="408">Cooperação</text><text x="765" y="436">Sistemas</text><text x="765" y="464">sociotécnicos</text><text x="765" y="492">Ambiente</text><text x="765" y="520">interno/externo</text>
