<text x="305" y="425">Fatores</text><text x="305" y="455">físicos</text>
<text x="615" y="425" font-size="23">Fatores</text><text x="615" y="453" font-size="23">organizacionais</text>
</g>
<circle cx="480" cy="310" r="46" fill="#1A2751"/>
